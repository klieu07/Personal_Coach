[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coachline"
version = "0.5.0"
description = "A personal training and nutrition agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "twilio>=9.0,<10.0",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
