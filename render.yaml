# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

previews:
  generation: off

services:
  - type: web
    name: coachline-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"
      - key: COACHLINE_DATABASE_URL
        fromDatabase:
          name: coachline-postgres
          property: connectionString
      - key: COACHLINE_ADMIN_TOKEN
        generateValue: true
      - key: COACHLINE_LOG_LEVEL
        value: INFO
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

databases:
  - name: coachline-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: coachline
    user: coachline
    ipAllowList: []
