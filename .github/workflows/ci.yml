name: Coachline CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Coachline
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Compile application
        run: python -m compileall -q app tests
